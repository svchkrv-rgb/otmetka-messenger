name: Сборка и проверка

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Сервер, веб-клиент и автотест
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Сборка веб-клиента
        working-directory: client
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Установка сервера
        working-directory: server
        run: npm install --omit=dev --no-audit --no-fund

      - name: Автотест сценариев
        working-directory: server
        run: |
          DATA_DIR="$RUNNER_TEMP/data" HTTPS_PORT=0 node --no-warnings src/index.js > "$RUNNER_TEMP/server.log" 2>&1 &
          BASE=http://localhost:8080 node test/e2e.mjs
          curl -sf http://localhost:8080/ | grep -q 'id="root"' && echo "✓ веб-клиент отдаётся сервером"

      - name: Лог сервера
        if: always()
        run: cat "$RUNNER_TEMP/server.log" || true

  windows:
    name: Установщик для Windows
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'client/src-tauri -> target'

      - name: Зависимости клиента
        working-directory: client
        run: npm install --no-audit --no-fund

      - name: Сборка приложения
        working-directory: client
        run: npx tauri build

      - name: Установщик — в артефакты сборки
        uses: actions/upload-artifact@v4
        with:
          name: otmetka-windows-setup
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Релиз (для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: client/src-tauri/target/release/bundle/nsis/*.exe

  docker:
    name: Docker-образ сервера
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Вход в GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Сборка и публикация образа
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}:latest
